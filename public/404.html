<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Envision e-commerce</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the path into a query param and redirects to index.html
      var segmentCount = 1; // number of path segments in your repo name
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
